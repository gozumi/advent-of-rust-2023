name: "Birthing Anansi - Standard"
version: "1.0"
description: "Standard rules for Birthing Anansi game"
parameters:
  max_value: 1000
  min_value: 1
  multiplier: 1
  rules:
    - name: "base_score"
      condition: "default"
      value: 1000
    - name: "bonus_threshold"
      condition: "score_above"
      value: 500
    - name: "penalty_threshold"
      condition: "score_below"
      value: 100
